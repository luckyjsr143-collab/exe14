<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Menu</title>
    <style>
        body {
          font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
          background-color: #92f8d6;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          margin: 0;
        }

        
        select {
          background-color: #ffffff;
          color: #333333;
          border: 2px solid #007bff;
          border-radius: 8px;
          padding: 12px 20px;
          font-size: 16px;
          font-weight: bold;
          cursor: pointer;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
          outline: none;
          transition: all 0.3s ease;
        }

       
        select:hover {
          border-color: #0056b3;
          box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        
        a {
          margin-top: 20px;
          font-size: 16px;
          color: #007bff;
          text-decoration: none;
          font-weight: bold;
          border-bottom: 2px solid transparent;
          transition: all 0.3s ease;
        }
        a:hover {
          color: #1200b3;
          border-bottom-color: #0056b3; 
        }
    </style>
  </head>
  <body>
    <select>
      <option>Momos</option>
      <option>Chicken</option>
      <option>Chilli</option>
      <option>Roll Chicken</option>
      <option>Pizza</option>
      <option>Burger</option>
    </select>
    <br>
<!-- दूसरे नए पेज पर जाने का लिंक -->
<a href="about.html">About Me More CLICK HERE →</a>

  </body>
</html>
